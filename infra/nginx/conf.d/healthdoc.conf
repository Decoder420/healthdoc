# Dev certs: run infra/nginx/generate-dev-certs.sh once.
# Prod: replace with real certs (Let's Encrypt / hospital CA) — same paths.

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }
upstream keycloak { server keycloak:8080; }

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    # TLS 1.3 only (B1-W1-03). Add TLSv1.2 only if legacy clients require it.
    ssl_protocols TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    # CSP: 'unsafe-inline'/'unsafe-eval' needed by Next.js dev; tighten for prod builds.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none'" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # FastAPI
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend;
    }

    # Keycloak (mounted at /auth via --http-relative-path)
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://keycloak;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
    }

    # Queue-display websockets + Next.js HMR
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/v1/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Next.js
    location / {
        proxy_pass http://frontend;
    }
}
